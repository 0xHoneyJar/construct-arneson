# VENDOR.yaml — the pin for vendored Gygax contract files (FR-9, R-1; sdd.md §3.4)
#
# These files are byte-exact copies of Gygax's contract. They are GYGAX'S FILES,
# never edited here. Every validator run self-checks the vendored files' sha256
# against this pin and refuses to run (exit 2) on mismatch — the validators were
# written against exactly these bytes (sdd.md §5.2.1). The arneson-with-gygax CI
# leg additionally byte-diffs these copies against the sibling checkout and fails
# loudly on drift.
#
# To re-vendor: copy the upstream files, update sha256 + upstream_git_sha here,
# and REVISIT validate_sidecar.py / validate_batch.py against the new bytes
# before producing any batch.

