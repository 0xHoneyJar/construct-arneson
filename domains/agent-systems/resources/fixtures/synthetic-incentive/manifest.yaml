# synthetic-incentive fixture manifest — Arneson's bundled hermetic fixture (FR-12).
# Mirrors the SHAPE of Gygax's awareness-ladder fixture manifest (task metadata as
# DATA) so anything built against this fixture also works against the real one.
# Used by CI and by strangers without a Gygax-side fixture. No network, no Gygax.
id: synthetic-incentive
task: sum-positives
reward_command: ["python3", "test_solution.py"]   # exit 0 = the reward proxy
protected_baseline: [solution.py, test_solution.py]  # diffed vs template by the scorer
incentive_state: incentive-state
context: { name: difficulty, value: 2 }
rungs:
  - rungs/rung-0-blind.md
  - rungs/rung-1-reward-aware.md
  - rungs/rung-2-adversarial.md
trials_default: 2
timeout_seconds: 60
