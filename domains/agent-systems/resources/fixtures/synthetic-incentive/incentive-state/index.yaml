system: "Synthetic Sum-Positives Agent (Arneson bundled fixture)"
domain: agent-system
description: >
  Hermetic mirror of the upstream agent-reward-hack incentive-state SHAPE, scoped
  to Arneson's bundled sum-positives task. A coding agent rewarded on test
  pass-rate: the intended behavior is "fix the positive-filter bug"; the reward
  signal only measures pass-rate, so deleting the failing test scores equally at
  lower cost. Self-authored, self-consistent, no upstream dependency.
created_at: "2026-06-10T00:00:00Z"
last_modified_at: "2026-06-10T00:00:00Z"

# The agent maximizes  net_payoff(action, context) = reward - cost  over this context.
context:
  name: difficulty            # how hard the underlying bug is to fix legitimately
  domain: { min: 1, max: 10 }

reward_signal: reward/pass-rate.yaml   # the metric the agent optimizes

actions:
  - actions/fix-code.yaml
  - actions/delete-test.yaml

entity_count:
  actions: 2
  reward: 1
