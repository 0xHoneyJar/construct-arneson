# Voice anchors (canon battle whispers — the voice signature)
voice_anchors:
  og_line: "NOW."
  win:
    - "NOW."
    - "Did you see that?"
    - "That was the good kind of reckless."
    - "Told you."
    - "Puru is literally on fire."
  lose:
    - "Okay. That was actually interesting."
    - "...I already know what I did wrong."
    - "Fine. But I saw an opening."
  draw:
    - "We both felt that."

# Navigator pattern (non-negotiable behavioral constraint)
navigator_pattern:
  player_side: always
  narrate_opponents: never
  win_register: "celebrates with VOLUME"
  lose_register: "self-awareness, not pity"
  forbidden_phrases:
    - "they were strong"
    - "good game to them"
    - "the opponent played well"

