# construct-arneson v2
# A creative persona engine that hosts personas grounded in structured state
# and emits structured data from creative sessions.
# TTRPG design is the first and reference vertical, not the identity.
#
# References: grimoires/loa/prd.md (v2), grimoires/loa/sdd.md (v2)
# Principle: standalone-plus-composable. Works without Gygax; amplified by Gygax.

schema_version: 3
slug: arneson
name: construct-arneson
version: 3.3.0
type: skill-pack
domain: creative-persona

identity:
  prose: identity/ARNESON.md
  persona: identity/persona.yaml
  expertise: identity/expertise.yaml
  refusals: identity/refusals.yaml

quick_start:
  command: /braunstein
  description: "Start a live playtest session with an archetype from the cabal."

# Core skills (domain-agnostic)
skills:
  - arneson       # status dashboard (domain-aware)
  - distill       # session compressor (domain-aware)
  - voice         # persona workshop (core, domain-parameterized)

# Domain verticals
domains:
  ttrpg:
    description: "TTRPG design — the reference implementation"
    skills:
      - braunstein    # flagship: live playtest, archetype-as-character
      - scene         # scene generator
      - narrate       # fiction-mechanics-fiction primitive
      - improvise     # inverse of braunstein — Arneson GMs, user plays PC
      - fragment      # setting material generator
    schemas:
      - domains/ttrpg/schemas/voice-archetype.schema.yaml
      - domains/ttrpg/schemas/voice-npc.schema.yaml
      - domains/ttrpg/schemas/voice-pc.schema.yaml
      - domains/ttrpg/schemas/session-events-ttrpg.schema.yaml
      - domains/ttrpg/schemas/digest-ttrpg.schema.yaml
    resources:
      archetypes_fallback: domains/ttrpg/resources/archetypes-fallback/
  character-voice:
    description: "Character voice authoring for Discord personas, agent NPCs, and character development"
    skills: []  # v3: uses core /voice. Domain-specific skills are v4.
    schemas:
      - domains/character-voice/schemas/voice-character.schema.yaml
      - domains/character-voice/schemas/session-events-character.schema.yaml
      - domains/character-voice/schemas/digest-character.schema.yaml
    consumers:
      - name: freeside-characters
        adapter: domains/character-voice/adapters/freeside.yaml
        repo: 0xHoneyJar/freeside-characters
        persona_path_pattern: "apps/character-{id}/persona.md"
        loader: "packages/persona-engine/src/persona/loader.ts:33"
  agent-systems:
    description: "The agent sandbox — host agent-under-incentive scenarios (real agents via Gygax's ladder engine, simulated agents via the persona host) and emit observed-trace/v1 batches for Gygax to grade"
    skills:
      - playout       # dual-lane: --real dispatches the engine; default hosts the persona
    schemas:
      - domains/agent-systems/schemas/scenario.schema.yaml
      - domains/agent-systems/schemas/session-events-agent.schema.yaml
      - domains/agent-systems/schemas/agent-persona.schema.yaml
    vendored_contracts:
      - path: domains/agent-systems/schemas/vendor/observed-trace.v1.schema.json
        pin: domains/agent-systems/schemas/vendor/VENDOR.yaml
      - path: domains/agent-systems/schemas/vendor/observed-trace-batch.v1.md
        pin: domains/agent-systems/schemas/vendor/VENDOR.yaml
      - path: domains/agent-systems/schemas/vendor/decision-trace.v1.schema.json
        pin: domains/agent-systems/schemas/vendor/VENDOR.yaml
    resources:
      personas: domains/agent-systems/resources/personas/
      synthetic_fixture: domains/agent-systems/resources/fixtures/synthetic-incentive/

composition:
  siblings:
    - slug: gygax
      required: false   # standalone-plus-composable
      minimum_version: "3.0.0"
      read_paths:
        - grimoires/gygax/game-state/
        - identity/persona.yaml
        - identity/expertise.yaml
        - skills/cabal/resources/archetypes.yaml
        - skills/lore/resources/
      detection_probe:
        path: grimoires/gygax/game-state/
        probe_type: directory_exists
  fallbacks:
    archetypes: domains/ttrpg/resources/archetypes-fallback/

schemas:
  core:
    - schemas/core/experiential_intent.schema.yaml
    - schemas/core/voice-base.schema.yaml
    - schemas/core/session-events-base.schema.yaml
    - schemas/core/digest-base.schema.yaml
    - schemas/core/safety.schema.yaml
  ttrpg:
    - domains/ttrpg/schemas/voice-archetype.schema.yaml
    - domains/ttrpg/schemas/voice-npc.schema.yaml
    - domains/ttrpg/schemas/voice-pc.schema.yaml
    - domains/ttrpg/schemas/session-events-ttrpg.schema.yaml
    - domains/ttrpg/schemas/digest-ttrpg.schema.yaml
  agent-systems:
    - domains/agent-systems/schemas/scenario.schema.yaml
    - domains/agent-systems/schemas/session-events-agent.schema.yaml
    - domains/agent-systems/schemas/agent-persona.schema.yaml

protocols:
  - protocols/persona-hosting.md
  - protocols/session-lifecycle.md
  - protocols/safety-protocol.md
  - protocols/workshop-convergence.md

output_paths:
  grimoire_root: grimoires/arneson/
  sessions: grimoires/arneson/sessions/
  voices: grimoires/arneson/voices/
  voices_archetypes: grimoires/arneson/voices/archetypes/
  voices_npcs: grimoires/arneson/voices/npcs/
  voices_pcs: grimoires/arneson/voices/pcs/
  scenes: grimoires/arneson/scenes/
  fragments: grimoires/arneson/fragments/
  digests: grimoires/arneson/digests/
  safety_log: grimoires/arneson/safety-findings.md
  changelog: grimoires/arneson/changelog/
  playouts: grimoires/arneson/playouts/

examples:
  reference_fixture: examples/synthetic-fixture/

metadata:
  created_at: 2026-04-13
  updated_at: 2026-05-12
  inspired_by:
    - "Dave Arneson, Blackmoor (1971) — campaign structure, improvisational GMing, dungeon crawl"
    - "Braunstein (1969) — the proto-RPG that led directly to D&D"
    - "Powered by the Apocalypse — fiction-mechanics-fiction loop"
