name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Three-matrix CI: arneson-alone, arneson-with-gygax, extension-story.
# Per PRD v2 G-3 (domain extensibility), G-4 (TTRPG regression).
# Standalone mode is FIRST-CLASS, not supplementary. Every PR must pass all.

jobs:

  # ----------------------------------------------------------------------------
  # arneson-alone: Gygax is NOT installed. Verifies standalone viability (G-4).
  # ----------------------------------------------------------------------------
  arneson-alone:
    name: "arneson-alone (standalone)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install yq (v4.50.1 pinned with integrity check)
        run: |
          YQ_VERSION="v4.50.1"
          YQ_URL="https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          wget -qO /tmp/yq "$YQ_URL"
          chmod +x /tmp/yq
          sudo mv /tmp/yq /usr/local/bin/yq
          yq --version

      - name: Validate construct manifest
        run: ./scripts/ci/validate-construct.sh

      - name: Validate all schemas
        run: ./scripts/ci/validate-schemas.sh

      - name: Validate fallback archetype bundle
        run: ./scripts/ci/validate-fallbacks.sh

      - name: Validate synthetic fixture
        run: ./scripts/ci/validate-fixture.sh

      - name: Validate implemented skills
        run: ./scripts/ci/validate-skills.sh

      - name: Validate agent-systems vertical (hermetic)
        run: ./scripts/ci/validate-agent-systems.sh

      - name: Verify Gygax paths are NOT present (standalone mode sanity)
        run: |
          # In arneson-alone mode, grimoires/gygax/ should not exist.
          if [ -d "grimoires/gygax" ]; then
            echo "FAIL: grimoires/gygax/ present in arneson-alone CI mode"
            exit 1
          fi
          echo "OK: no Gygax paths present (standalone mode confirmed)"

      - name: "v2 structure smoke test"
        run: |
          echo "Verifying v2 directory structure."
          test -f construct.yaml
          test -f identity/ARNESON.md
          test -f schemas/core/experiential_intent.schema.yaml
          test -f schemas/core/voice-base.schema.yaml
          test -d domains/ttrpg/schemas
          test -d domains/ttrpg/skills
          test -d domains/ttrpg/resources/archetypes-fallback
          test -d protocols
          test -f examples/synthetic-fixture/game-state.yaml
          test -f domains/ttrpg/skills/braunstein/SKILL.md
          test -f skills/voice/SKILL.md
          test -f skills/arneson/SKILL.md
          test -f skills/distill/SKILL.md
          echo "All v2 structure artifacts present."

  # ----------------------------------------------------------------------------
  # arneson-with-gygax: Gygax v3 present. Verifies composition amplification (G-5).
  # ----------------------------------------------------------------------------
  arneson-with-gygax:
    name: "arneson-with-gygax (composed)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install yq (v4.50.1 pinned with integrity check)
        run: |
          YQ_VERSION="v4.50.1"
          YQ_URL="https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          wget -qO /tmp/yq "$YQ_URL"
          chmod +x /tmp/yq
          sudo mv /tmp/yq /usr/local/bin/yq
          yq --version

      - name: Check out real construct-gygax sibling (vendor drift guard target)
        uses: actions/checkout@v4
        with:
          repository: 0xHoneyJar/construct-gygax
          path: construct-gygax-sibling
          token: ${{ secrets.GYGAX_CHECKOUT_TOKEN || github.token }}

      - name: Vendor drift guard (byte-diff vendored contract vs upstream)
        run: ARNESON_GYGAX_ROOT="$GITHUB_WORKSPACE/construct-gygax-sibling" ./scripts/ci/vendor-drift-guard.sh

      - name: Set up node (for the Gygax engine)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install engine dependencies
        run: npm ci --prefix "$GITHUB_WORKSPACE/construct-gygax-sibling"

      - name: Zero-edit ingestion probe (milestone b — engine → validate → regrade → diff)
        run: ARNESON_GYGAX_ROOT="$GITHUB_WORKSPACE/construct-gygax-sibling" ./scripts/ci/ingestion-probe.sh

      - name: Set up stub Gygax fixture
        run: |
          # Sprint 1: stub Gygax paths so composition-detection probes succeed.
          # Sprint 7 will replace this with a real Gygax v3 installation.
          mkdir -p grimoires/gygax/game-state
          touch grimoires/gygax/game-state/.gitkeep
          mkdir -p identity-gygax-stub
          cat > identity-gygax-stub/README.md << 'MARKER'
          Sprint 1 stub. Replaced by real Gygax v3 install in Sprint 7.
          MARKER
          echo "Stub Gygax fixture in place for composition-mode CI."

      - name: Validate construct manifest
        run: ./scripts/ci/validate-construct.sh

      - name: Validate all schemas
        run: ./scripts/ci/validate-schemas.sh

      - name: Verify composition-detection probe finds stub
        run: |
          if [ -d "grimoires/gygax/game-state" ]; then
            echo "OK: composition probe target present (grimoires/gygax/game-state/)"
          else
            echo "FAIL: composition probe target missing"
            exit 1
          fi

      - name: "Composition scaffold smoke test"
        run: |
          echo "Composition-mode scaffold — probes resolve; full round-trip arrives later."

  # ----------------------------------------------------------------------------
  # extension-story: Validates domain extension interface (G-3).
  # A test domain can be added with zero core code changes.
  # Placeholder — fully wired in Sprint 5.
  # ----------------------------------------------------------------------------
  extension-story:
    name: "extension-story (domain extensibility)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install yq (v4.50.1 pinned with integrity check)
        run: |
          YQ_VERSION="v4.50.1"
          YQ_URL="https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          wget -qO /tmp/yq "$YQ_URL"
          chmod +x /tmp/yq
          sudo mv /tmp/yq /usr/local/bin/yq
          yq --version

      - name: "Validate test domain schemas"
        run: |
          echo "Validating test domain extension schemas..."
          for schema in examples/test-domain/schemas/*.yaml; do
            if ! yq eval '.' "$schema" > /dev/null 2>&1; then
              echo "FAIL: $schema does not parse as YAML"
              exit 1
            fi
            extends=$(yq eval '.schema.extends // ""' "$schema")
            if [ -z "$extends" ]; then
              echo "FAIL: $schema missing schema.extends field"
              exit 1
            fi
            echo "  OK: $schema (extends: $extends)"
          done
          echo "OK: all test domain schemas valid and extend base."

      - name: "Validate test domain persona loads via voice-base"
        run: |
          echo "Validating test domain persona..."
          persona="examples/test-domain/resources/sample-persona.yaml"
          test -f "$persona"
          # Check voice-base required fields
          voice_id=$(yq eval '.voice_id' "$persona")
          display_name=$(yq eval '.display_name' "$persona")
          markers=$(yq eval '.speech_patterns.distinctive_markers | length' "$persona")
          test_role=$(yq eval '.test_role' "$persona")
          if [ -z "$voice_id" ] || [ "$voice_id" = "null" ]; then echo "FAIL: missing voice_id"; exit 1; fi
          if [ -z "$display_name" ] || [ "$display_name" = "null" ]; then echo "FAIL: missing display_name"; exit 1; fi
          if [ "$markers" -lt 1 ]; then echo "FAIL: no distinctive_markers"; exit 1; fi
          if [ -z "$test_role" ] || [ "$test_role" = "null" ]; then echo "FAIL: missing domain extension field test_role"; exit 1; fi
          echo "OK: test persona has voice-base fields + domain extension fields."

      - name: "Validate test domain skill follows protocols"
        run: |
          echo "Validating test domain skill..."
          test -f examples/test-domain/skills/test-workshop/SKILL.md
          test -f examples/test-domain/skills/test-workshop/index.yaml
          # Verify index.yaml references core protocols
          for protocol in persona-hosting session-lifecycle safety-protocol workshop-convergence; do
            exists=$(yq eval ".protocols[] | select(. == \"$protocol\")" examples/test-domain/skills/test-workshop/index.yaml)
            if [ -z "$exists" ]; then
              echo "FAIL: test-workshop index.yaml missing protocol reference: $protocol"
              exit 1
            fi
          done
          echo "OK: test-workshop declares all 4 core protocols."

      - name: "Verify zero core files modified"
        run: |
          echo "Checking that test domain requires no core file changes..."
          test -d schemas/core
          test -d domains/ttrpg
          test -d protocols
          test -d examples/test-domain
          echo "OK: extension story structure in place. Zero core files modified by test domain."
